[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anjal-api"
version = "0.1.0"
description = "AnjalArivaan consolidated backend API"
requires-python = ">=3.11"
dependencies = [
    # Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "cryptography>=42.0.5",
    # Data
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "pydantic>=2.7.1",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.1",
    # HTTP
    "httpx>=0.27.0",
    # Google APIs (mail-sync)
    "google-api-python-client>=2.127.0",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    # Object storage (mail-sync)
    "minio>=7.2.7",
    # Vector store (ai-orchestrator)
    "qdrant-client>=1.9.1",
    # Templates (ai-orchestrator)
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
