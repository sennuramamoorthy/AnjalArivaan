[project]
name = "anjal-logger"
version = "0.1.0"
description = "Structured JSON logger for AnjalArivaan Python services"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anjal_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
